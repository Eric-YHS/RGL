<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="红绿灯决策任务示例">
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="170" y="72" width="620" height="360" fill="#ffffff" stroke="#111111" stroke-width="3"/>

  <rect x="326" y="82" width="308" height="38" rx="10" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
  <text x="480" y="107" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#222222">
    <tspan>剩余报酬：</tspan><tspan font-weight="700">20点</tspan>
  </text>

  <line x1="260" y1="356" x2="708" y2="356" stroke="#bdbdbd" stroke-width="2" stroke-dasharray="8 8"/>

  <line x1="480" y1="144" x2="480" y2="408" stroke="#d1d1d1" stroke-width="4"/>
  <rect x="465" y="116" width="30" height="96" fill="#cfcfcf"/>
  <circle cx="480" cy="136" r="13" fill="#f20f16"/>
  <circle cx="480" cy="165" r="13" fill="#dcc36d"/>
  <circle cx="480" cy="194" r="13" fill="#b9d4b7"/>

  <line x1="690" y1="146" x2="690" y2="410" stroke="#111111" stroke-width="4"/>

  <circle cx="238" cy="356" r="24" fill="#2f6fed"/>
  <ellipse cx="238" cy="386" rx="22" ry="5" fill="rgba(0,0,0,0.16)"/>

  <rect x="425" y="446" width="110" height="48" rx="4" fill="#3d3d3d"/>
  <text x="480" y="478" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">移动</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">
    <rect x="180" y="123" width="218" height="48" fill="#ff9f05"/>
    <polygon points="398,123 436,104 398,154" fill="#ff9f05"/>
    <text x="195" y="154">Your endowment</text>

    <rect x="318" y="218" width="144" height="48" fill="#ff9f05"/>
    <polygon points="462,218 498,199 462,252" fill="#ff9f05"/>
    <text x="333" y="249">Stop light</text>

    <rect x="152" y="380" width="72" height="48" fill="#ff9f05"/>
    <polygon points="196,380 238,375 222,396" fill="#ff9f05"/>
    <text x="167" y="411">You</text>

    <rect x="245" y="358" width="184" height="48" fill="#ff9f05"/>
    <polygon points="429,406 466,446 392,406" fill="#ff9f05"/>
    <text x="260" y="389">Move button</text>

    <rect x="690" y="380" width="166" height="48" fill="#ff9f05"/>
    <polygon points="690,380 690,428 648,410" fill="#ff9f05"/>
    <text x="705" y="411">Finish line</text>
  </g>
</svg>
